name: Deploy GitHub Page

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # heterogeneity_tests.py calls scipy.stats; the page loads the same
      # package into Pyodide at run time
      - name: Install scipy
        run: pip install scipy

      # Both scripts write JSON to both streams, so the checks assert the
      # payload parses and carries what the pages read, not just that the
      # process exited 0
      - name: Sanity check pessev.py
        run: |
          python3 pessev.py 48 20 200 60 20260828 > out.json 2> summary.json
          python3 - <<'EOF'
          import json
          data = json.load(open("out.json"))
          summary = json.load(open("summary.json"))
          assert len(data["pesinc_i"]) == len(data["pessev_i"]) == 200
          assert summary["infected_count"] == sum(data["pesinc_i"])
          assert summary["achieved_mean"] == sum(data["pessev_i"]) / 200
          EOF

      - name: Sanity check pessev_wrapper.py
        run: |
          python3 pessev_wrapper.py --pesinc 48,10 --pessev 20,3 --threshold 10 \
            > out.json 2> summary.json
          python3 - <<'EOF'
          import json
          data = json.load(open("out.json"))
          summary = json.load(open("summary.json"))
          assert len(data["simulations"]) == len(summary["simulations"]) == 2
          for sim, entry in zip(data["simulations"], summary["simulations"]):
              assert sim["index"] == entry["index"]
              assert len(sim["pesinc_i"]) == len(sim["pessev_i"]) == 200
              counts = entry["threshold_counts"]
              # the three buckets must partition the samples
              assert sum(counts.values()) == 200, counts
          EOF

      # a rejected run must still leave stderr parseable, which is what both
      # pages rely on to show the reason
      - name: Sanity check the error path
        run: |
          ! python3 pessev_wrapper.py --pesinc 48,1 --pessev 20,99 2> error.json
          ! python3 pessev_wrapper.py --pesinc 48,10 --pessev 20 2> general.json
          python3 - <<'EOF'
          import json
          # wrapper.html marks the offending form row from this index, so a
          # failure that knows which simulation broke has to say so
          failed = json.load(open("error.json"))
          assert failed["error"] and failed["simulation"] == 2, failed
          # and one that is not about a particular row must not name one, or the
          # page would redden an innocent input
          general = json.load(open("general.json"))
          assert general["error"] and "simulation" not in general, general
          EOF

      - name: Sanity check heterogeneity_tests.py
        run: |
          python3 pessev_wrapper.py --pesinc 48,10,100,48,10,100 \
            --pessev 20,3,50,20,3,50 2>/dev/null > six.json
          python3 heterogeneity_tests.py --simulation-count 3 < six.json \
            > het.json 2> het.err
          # stderr must stay empty: scipy warns there on degenerate groups, and
          # loose text would break the one-JSON-document-per-stream contract
          test ! -s het.err
          python3 - <<'EOF'
          import json
          result = json.load(open("het.json"))    # json.loads rejects NaN
          assert result["treatment_count"] == 2
          assert [t["simulations"] for t in result["treatments"]] == [[1, 2, 3], [4, 5, 6]]
          for treatment in result["treatments"]:
              for name in ("levene", "bartlett"):
                  p = treatment[name]["p_value"]
                  assert p is None or 0.0 <= p <= 1.0, (name, p)
          EOF

      # an all-zero column leaves both tests undefined; the document must still
      # parse, carrying nulls rather than the NaN token json.dumps would write
      - name: Sanity check heterogeneity on degenerate data
        run: |
          python3 pessev_wrapper.py --pesinc 0,0 --pessev 0,0 2>/dev/null \
            > degenerate_in.json
          python3 heterogeneity_tests.py --simulation-count 2 \
            < degenerate_in.json > degenerate.json 2> degenerate.err
          # this is the input that makes scipy divide by zero and warn on
          # stderr, so it is the only place the warning guard can actually fire
          test ! -s degenerate.err
          python3 -c "
          import json
          t = json.load(open('degenerate.json'))['treatments'][0]
          assert t['levene']['statistic'] is None and 'note' in t['levene']
          "

      - name: Sanity check heterogeneity rejections
        run: |
          ! python3 heterogeneity_tests.py --simulation-count 1 < six.json 2> e1.json
          ! python3 heterogeneity_tests.py --simulation-count 4 < six.json 2> e2.json
          ! echo 'not json' | python3 heterogeneity_tests.py --simulation-count 2 2> e3.json
          python3 -c "
          import json
          for name in ('e1.json', 'e2.json', 'e3.json'):
              assert json.load(open(name))['error'], name
          "

      # Stage only what the page needs, so the spreadsheets and the PDF in the
      # repo do not end up on the public site
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html pessev.py wrapper.html pessev_wrapper.py \
             heterogeneity_tests.py _site/

      # enablement: turns Pages on (source = GitHub Actions) the first time this
      # runs, instead of failing with "Get Pages site failed"
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
