name: Deploy GitHub Page

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a newer push finish rather than cancelling it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Sanity check pessev.py
        run: python3 pessev.py 48 20 200 60 20260828 > /dev/null

      - name: Sanity check pessev_wrapper.py
        run: python3 pessev_wrapper.py --pesinc 48,10 --pessev 20,3 > /dev/null

      # --threshold is optional, so the check above already covers the page
      # without it; this one covers the threshold table it adds to stderr
      - name: Sanity check pessev_wrapper.py --threshold
        run: |
          python3 pessev_wrapper.py --pesinc 48,10 --pessev 20,3 --threshold 10 \
            2>&1 >/dev/null | grep -q '^=== threshold summary ===$'

      # Stage only what the page needs, so the spreadsheets and the PDF in the
      # repo do not end up on the public site
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html pessev.py wrapper.html pessev_wrapper.py _site/

      # enablement: turns Pages on (source = GitHub Actions) the first time this
      # runs, instead of failing with "Get Pages site failed"
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
