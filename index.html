<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PESINC / PESSEV Subsample Generator</title>
    <!-- Load Pyodide WebAssembly Framework -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        background-color: #f9f9f9;
        color: #333;
      }
      h1 {
        border-bottom: 2px solid #eaeaea;
        padding-bottom: 10px;
        color: #222;
      }
      .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        background-color: #0076ff;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      button:hover {
        background-color: #0060d6;
      }
      button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .output-container {
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      pre {
        background: #282c34;
        color: #abb2bf;
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        font-family: monospace;
        font-size: 13px;
        height: 350px;
        border: 1px solid #181a1f;
      }
      .stdout-header {
        color: #98c379;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .stderr-header {
        color: #e06c75;
        font-weight: bold;
        margin-bottom: 5px;
      }
      #status {
        font-weight: bold;
        color: #0076ff;
        margin-bottom: 15px;
      }
    </style>
  </head>
  <body>
    <h1>PESINC / PESSEV Subsample Generator</h1>
    <div id="status">⏳ Initializing WebAssembly Python environment...</div>

    <form id="paramForm" onsubmit="runGenerator(event)">
      <div class="grid">
        <div class="form-group">
          <label for="pesinc">PESINC (Incidence fraction, 0.0 - 1.0):</label>
          <input
            type="number"
            id="pesinc"
            step="any"
            min="0"
            max="1"
            value="0.48"
            required
          />
        </div>
        <div class="form-group">
          <label for="pessev"
            >PESSEV (Mean severity fraction, 0.0 - 1.0):</label
          >
          <input
            type="number"
            id="pessev"
            step="any"
            min="0"
            max="1"
            value="0.20"
            required
          />
        </div>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="sampleCount">SAMPLE_COUNT (Total subsamples):</label>
          <input type="number" id="sampleCount" min="1" value="200" required />
        </div>
        <div class="form-group">
          <label for="spread">PESSEV_SPREAD (Coeff. of variation):</label>
          <input
            type="number"
            id="spread"
            step="any"
            min="0"
            value="0.6"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="seed">SEED (Random integer seed):</label>
        <input type="number" id="seed" required />
      </div>

      <button type="submit" id="runBtn" disabled>Run Simulation</button>
    </form>

    <div class="output-container">
      <div>
        <div class="stdout-header">📊 Data (stdout - TSV)</div>
        <pre id="stdoutView">Output data will appear here...</pre>
      </div>
      <div>
        <div class="stderr-header">📝 Summary (stderr)</div>
        <pre id="stderrView">Summary telemetry will appear here...</pre>
      </div>
    </div>

    <script type="text/javascript">
      let pyodideInstance = null;
      let pythonCodeText = "";

      // Automatically calculate and set the seed default to YYYYMMDD string format
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const dd = String(today.getDate()).padStart(2, "0");
      document.getElementById("seed").value = parseInt(`${yyyy}${mm}${dd}`);

      // Initialize Environment and External Python Script Source
      async function initEnvironment() {
        try {
          // 1. Fetch the separate script file asynchronously
          const response = await fetch("./pessev.py");
          if (!response.ok) throw new Error("Could not find pessev.py file.");
          pythonCodeText = await response.text();

          // 2. Load the WebAssembly interpreter
          pyodideInstance = await loadPyodide();

          document.getElementById("status").innerText =
            "✅ System Ready! Loaded pessev.py successfully.";
          document.getElementById("status").style.color = "#28a745";
          document.getElementById("runBtn").disabled = false;
        } catch (err) {
          document.getElementById("status").innerText =
            `❌ Error: ${err.message}`;
          document.getElementById("status").style.color = "#dc3545";
          console.error(err);
        }
      }

      // Handle Execution
      async function runGenerator(event) {
        event.preventDefault();

        document.getElementById("stdoutView").innerText =
          "Processing calculation...";
        document.getElementById("stderrView").innerText =
          "Processing calculation...";

        const pesinc = document.getElementById("pesinc").value;
        const pessev = document.getElementById("pessev").value;
        const sampleCount = document.getElementById("sampleCount").value;
        const spread = document.getElementById("spread").value;
        const seed = document.getElementById("seed").value;

        let stdoutBuffer = "";
        let stderrBuffer = "";

        pyodideInstance.setStdout({
          batched: (text) => {
            stdoutBuffer += text + "\n";
          },
        });
        pyodideInstance.setStderr({
          batched: (text) => {
            stderrBuffer += text + "\n";
          },
        });

        try {
          // Bind user parameters to global window vars within Python's instance environment
          pyodideInstance.globals.set("sys_argv", [
            "pessev.py",
            pesinc,
            pessev,
            sampleCount,
            spread,
            seed,
          ]);
          pyodideInstance.globals.set("raw_script_content", pythonCodeText);

          // Not indented: runPythonAsync hands the string straight to Python,
          // so any leading whitespace is an IndentationError.
          await pyodideInstance.runPythonAsync(
            [
              "import sys",
              // Its own namespace, so __name__ is not "__main__" and the
              // script's entrypoint guard does not fire during the exec
              "pessev_module = {'__name__': 'pessev'}",
              "exec(raw_script_content, pessev_module)",
              "# Run the entrypoint function with the UI arguments",
              "pessev_module['main']([str(arg) for arg in sys_argv])",
            ].join("\n"),
          );

          document.getElementById("stdoutView").innerText =
            stdoutBuffer || "No output generated.";
          document.getElementById("stderrView").innerText =
            stderrBuffer || "No summary generated.";
        } catch (error) {
          document.getElementById("stderrView").innerText =
            `Execution Interrupted:\n${error.message}`;
        }
      }

      initEnvironment();
    </script>
  </body>
</html>
