<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MM GENERATOR</title>
    <!-- Load Pyodide WebAssembly Framework -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 800px;
        margin: 40px auto;
        padding: 0 20px;
        line-height: 1.6;
        background-color: #f9f9f9;
        color: #333;
      }
      h1 {
        border-bottom: 2px solid #eaeaea;
        padding-bottom: 10px;
        color: #222;
      }
      .form-group {
        margin-bottom: 15px;
        display: flex;
        flex-direction: column;
      }
      label {
        font-weight: bold;
        margin-bottom: 5px;
      }
      input {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
      }
      button {
        background-color: #0076ff;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 4px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 10px;
      }
      button:hover {
        background-color: #0060d6;
      }
      button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .output-container {
        margin-top: 30px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      pre {
        background: #282c34;
        color: #abb2bf;
        padding: 15px;
        border-radius: 6px;
        overflow-x: auto;
        font-family: monospace;
        font-size: 13px;
        height: 350px;
        border: 1px solid #181a1f;
      }
      .stdout-header {
        color: #98c379;
        font-weight: bold;
        margin-bottom: 5px;
      }
      .stderr-header {
        color: #e06c75;
        font-weight: bold;
        margin-bottom: 5px;
      }
      #status {
        font-weight: bold;
        color: #0076ff;
        margin-bottom: 15px;
      }
      .copy-buttons {
        display: flex;
        gap: 10px;
      }
      .copy-buttons button {
        font-size: 14px;
        padding: 8px 14px;
      }
    </style>
  </head>
  <body>
    <h1>PESINC / PESSEV Subsample Generator</h1>
    <div id="status">⏳ Initializing WebAssembly Python environment...</div>

    <form id="paramForm" onsubmit="runGenerator(event)">
      <div class="grid">
        <div class="form-group">
          <label for="pesinc">PESINC (Incidence %, 0 - 100):</label>
          <input
            type="number"
            id="pesinc"
            step="any"
            min="0"
            max="100"
            value="48"
            required
          />
        </div>
        <div class="form-group">
          <label for="pessev">PESSEV (Mean severity %, 0 - 100):</label>
          <input
            type="number"
            id="pessev"
            step="any"
            min="0"
            max="100"
            value="20"
            required
          />
        </div>
      </div>

      <div class="grid">
        <div class="form-group">
          <label for="sampleCount">SAMPLE_COUNT (Total subsamples):</label>
          <input type="number" id="sampleCount" min="1" value="200" required />
        </div>
        <div class="form-group">
          <!-- no max: a coefficient of variation is a ratio, so >100% is valid -->
          <label for="spread">PESSEV_SPREAD (Coeff. of variation %):</label>
          <input
            type="number"
            id="spread"
            step="any"
            min="0"
            value="60"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="seed">SEED (Random integer seed):</label>
        <input type="number" id="seed" required />
      </div>

      <button type="submit" id="runBtn" disabled>Run Simulation</button>
    </form>

    <div class="output-container">
      <div>
        <div class="stdout-header">
          📊 Data (stdout - TSV, whole percent points)
        </div>
        <pre id="stdoutView">Output data will appear here...</pre>
        <div class="copy-buttons">
          <button
            type="button"
            id="copyPesincBtn"
            onclick="copyColumn('pesinc_i', this)"
          >
            Copy pesinc_i
          </button>
          <button
            type="button"
            id="copyPessevBtn"
            onclick="copyColumn('pessev_i', this)"
          >
            Copy pessev_i
          </button>
        </div>
      </div>
      <div>
        <div class="stderr-header">📝 Summary (stderr)</div>
        <pre id="stderrView">Summary telemetry will appear here...</pre>
      </div>
    </div>

    <script type="text/javascript">
      let pyodideInstance = null;
      let pythonCodeText = "";
      // Columns of the last run, straight from Python. Kept as arrays because
      // the stdout <pre> is not a usable source: assigning innerText turns the
      // newlines into <br> elements, so the TSV rows cannot be read back.
      let lastColumns = { pesinc_i: [], pessev_i: [] };

      // Automatically calculate and set the seed default to YYYYMMDD string format
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, "0");
      const dd = String(today.getDate()).padStart(2, "0");
      document.getElementById("seed").value = parseInt(`${yyyy}${mm}${dd}`);

      // Initialize Environment and External Python Script Source
      async function initEnvironment() {
        try {
          // 1. Fetch the separate script file asynchronously
          const response = await fetch("./pessev.py");
          if (!response.ok) throw new Error("Could not find pessev.py file.");
          pythonCodeText = await response.text();

          // 2. Load the WebAssembly interpreter
          pyodideInstance = await loadPyodide();

          document.getElementById("status").innerText =
            "✅ System Ready! Loaded pessev.py successfully.";
          document.getElementById("status").style.color = "#28a745";
          document.getElementById("runBtn").disabled = false;
        } catch (err) {
          document.getElementById("status").innerText =
            `❌ Error: ${err.message}`;
          document.getElementById("status").style.color = "#dc3545";
          console.error(err);
        }
      }

      // Handle Execution
      async function runGenerator(event) {
        event.preventDefault();

        lastColumns = { pesinc_i: [], pessev_i: [] };
        document.getElementById("stdoutView").innerText =
          "Processing calculation...";
        document.getElementById("stderrView").innerText =
          "Processing calculation...";

        const pesinc = document.getElementById("pesinc").value;
        const pessev = document.getElementById("pessev").value;
        const sampleCount = document.getElementById("sampleCount").value;
        const spread = document.getElementById("spread").value;
        const seed = document.getElementById("seed").value;

        let stdoutBuffer = "";
        let stderrBuffer = "";

        pyodideInstance.setStdout({
          batched: (text) => {
            stdoutBuffer += text + "\n";
          },
        });
        pyodideInstance.setStderr({
          batched: (text) => {
            stderrBuffer += text + "\n";
          },
        });

        try {
          // Bind user parameters to global window vars within Python's instance environment
          pyodideInstance.globals.set("sys_argv", [
            "pessev.py",
            pesinc,
            pessev,
            sampleCount,
            spread,
            seed,
          ]);
          pyodideInstance.globals.set("raw_script_content", pythonCodeText);

          // Not indented: runPythonAsync hands the string straight to Python,
          // so any leading whitespace is an IndentationError.
          const resultProxy = await pyodideInstance.runPythonAsync(
            [
              "import sys",
              // Its own namespace, so __name__ is not "__main__" and the
              // script's entrypoint guard does not fire during the exec
              "pessev_module = {'__name__': 'pessev'}",
              "exec(raw_script_content, pessev_module)",
              "# Run the entrypoint function with the UI arguments; it returns",
              "# the two columns as lists",
              "pessev_module['main']([str(arg) for arg in sys_argv])",
            ].join("\n"),
          );

          // main() hands back (pesinc_i, pessev_i) as Python lists
          if (resultProxy) {
            const [pesincColumn, pessevColumn] = resultProxy.toJs();
            resultProxy.destroy();
            lastColumns = { pesinc_i: pesincColumn, pessev_i: pessevColumn };
          }
          document.getElementById("stdoutView").innerText =
            stdoutBuffer || "No output generated.";
          document.getElementById("stderrView").innerText =
            stderrBuffer || "No summary generated.";
        } catch (error) {
          document.getElementById("stderrView").innerText =
            `Execution Interrupted:\n${error.message}`;
        }
      }

      // One value per line, so a paste lands in a single spreadsheet column
      async function copyColumn(columnName, button) {
        const values = lastColumns[columnName].join("\n");
        const originalLabel = button.dataset.label || button.innerText.trim();
        button.dataset.label = originalLabel;

        if (!values) {
          flashButton(button, "Run the simulation first");
          return;
        }

        try {
          await navigator.clipboard.writeText(values);
          flashButton(button, "Copied!");
        } catch (error) {
          // Clipboard API is unavailable outside secure contexts
          const scratch = document.createElement("textarea");
          scratch.value = values;
          document.body.appendChild(scratch);
          scratch.select();
          const copied = document.execCommand("copy");
          document.body.removeChild(scratch);
          flashButton(button, copied ? "Copied!" : "Copy failed");
        }
      }

      function flashButton(button, message) {
        button.innerText = message;
        setTimeout(() => {
          button.innerText = button.dataset.label;
        }, 1200);
      }

      initEnvironment();
    </script>
  </body>
</html>
